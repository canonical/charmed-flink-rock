juju:
  disable: true

providers:
  microk8s:
    enable: true
    channel: 1.34-strict/stable
    bootstrap: false
    addons:
      - dns
      - hostpath-storage
      - metallb:10.64.140.43-10.64.140.49

host:
  packages:
    - just
    - curl
  snaps:
    microceph:
      channel: squid/stable
    kubectl:
      channel: latest/stable
    aws-cli:
      channel: latest/stable
