juju:
  disable: true

providers:
  k8s:
    enable: true
    bootstrap: false
    channel: 1.34-classic/stable
    features:
      local-storage:
      load-balancer:
        enabled: true
        l2-mode: true
        cidrs: 10.64.0.0/16
    bootstrap-constraints:
      root-disk: 4G

host:
  packages:
    - just
    - curl
  snaps:
    microceph:
      channel: squid/stable
    kubectl:
      channel: latest/stable
    aws-cli:
      channel: latest/stable
