summary: History server test suite

prepare: |
  microceph cluster bootstrap
  microceph disk add loop,1G,3
  microceph enable rgw
  microceph.radosgw-admin user create \
    --uid test --display-name test \
    --access-key=foo --secret-key=bar
  IP=$(ip -4 -j route get 2.2.2.2 | jq -r '.[] | .prefsrc')
  printf "S3_ENDPOINT=http://%s:80/\nS3_ACCESS_KEY=foo\nS3_SECRET_KEY=bar\n" "$IP" \
    > "$SPREAD_PATH/.env"

  export AWS_ACCESS_KEY_ID=foo
  export AWS_SECRET_ACCESS_KEY=bar
  export AWS_ENDPOINT_URL="http://${IP}:80"
  aws s3 mb s3://test-flink
  touch .keep
  aws s3 cp .keep s3://test-flink/flink-events/.keep

execute: |
  cd "$SPREAD_PATH"
  just test-history-server
