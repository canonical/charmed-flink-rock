name: Build ROCK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install tox
        run: python3 -m pip install tox
      - name: YAML Lint
        run: tox -e lint

  build:
    strategy:
      matrix:
        system:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.system.os }}
    timeout-minutes: 60
    needs:
      - lint
    steps:
      - name: Disk cleanup
        run: |
          sudo rm -rf \
            /opt/google \
            /opt/hostedtoolcache \
            /opt/microsoft/powershell \
            /opt/microsoft/msedge \
            "$AGENT_TOOLSDIRECTORY" \
            /usr/lib/firefox \
            /usr/lib/mono \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/gradle* \
            /usr/share/miniconda \
            /usr/share/sbt \
            /usr/share/swift \
            /home/linuxbrew
          pipx uninstall-all
          printf '\nDisk usage\n'
          df --human-readable

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup LXD
        uses: canonical/setup-lxd@main
        with:
          channel: 5.21/stable

      - name: Install dependencies
        run: |
          sudo snap install yq
          sudo snap install rockcraft --classic --edge
          sudo snap install regclient

      - name: Build ROCK
        id: build
        run: |
          rockcraft pack --verbose

          VERSION=$(yq '.version' rockcraft.yaml)
          echo "rock=charmed-flink_${VERSION}_${{ matrix.system.arch }}.rock" >> $GITHUB_OUTPUT

      - name: Add additional labels
        run: |
          COMMIT_ID=$(git log -1 --format=%H)
          DESCRIPTION=$(yq .description rockcraft.yaml | xargs)
          FILE=${{ steps.build.outputs.rock }}

          rockcraft.skopeo copy "oci-archive:${FILE}" oci:to_process:latest
          regctl image mod ocidir://to_process:latest --replace \
            --label "org.opencontainers.image.revision=${COMMIT_ID}" \
            --label "org.opencontainers.image.source=${{ github.repositoryUrl }}" \
            --label "org.opencontainers.image.description=${DESCRIPTION}"
          regctl image export ocidir://to_process:latest "${FILE}"
          rm -r to_process

      - name: Upload locally built ROCK artifact
        uses: actions/upload-artifact@v4
        with:
          name: charmed-flink-${{ matrix.system.arch }}
          path: ${{ steps.build.outputs.rock }}
