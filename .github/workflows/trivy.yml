name: Trivy Security Scanner

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Trivy scan and SBOM generation
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install rockcraft (for skopeo)
        run: |
          sudo snap install rockcraft --classic --edge

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: charmed-flink-${{ matrix.arch }}

      - name: Find ROCK file
        id: find_rock
        run: |
          ROCK=$(ls charmed-flink_*_${{ matrix.arch }}.rock 2>/dev/null | head -1)
          if [ -z "${ROCK}" ]; then
            echo "No ROCK file found for architecture ${{ matrix.arch }}"
            exit 1
          fi
          echo "rock=${ROCK}" >> $GITHUB_OUTPUT

      - name: Import locally
        run: |
          sudo rockcraft.skopeo --insecure-policy copy \
            oci-archive:${{ steps.find_rock.outputs.rock }} \
            docker-daemon:trivy/charmed-flink-${{ matrix.arch }}:test

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "trivy/charmed-flink-${{ matrix.arch }}:test"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "MEDIUM,HIGH,CRITICAL"
          cache: "false"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: charmed-flink-${{ matrix.arch }}

      - name: Run Trivy in GitHub SBOM mode and submit results to Dependency Graph
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "image"
          format: "spdx-json"
          output: "dependency-results-${{ matrix.arch }}.sbom.json"
          image-ref: "trivy/charmed-flink-${{ matrix.arch }}:test"
          github-pat: ${{ secrets.GITHUB_TOKEN }}
          severity: "MEDIUM,HIGH,CRITICAL"
          scanners: "vuln"

      - name: Upload trivy report as a Github artifact
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sbom-report-${{ matrix.arch }}
          path: "${{ github.workspace }}/dependency-results-${{ matrix.arch }}.sbom.json"
          retention-days: 90
