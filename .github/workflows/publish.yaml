name: Publish ROCK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - "2/edge"

permissions:
  contents: read

jobs:
  build-rock:
    uses: ./.github/workflows/build.yaml

  trivy:
    needs: build-rock
    uses: ./.github/workflows/trivy.yaml
    with:
      submit_dependency_graph: true
    permissions:
      contents: write
      security-events: write

  publish:
    needs: [build-rock, trivy]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tooling
        run: |
          sudo snap install rockcraft --classic
          sudo snap alias rockcraft.skopeo skopeo
          pipx install git+https://github.com/canonical/data-platform-workflows#subdirectory=_cli

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: unused
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download amd64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: charmed-flink-amd64
          path: to_convert

      - name: Download arm64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: charmed-flink-arm64
          path: to_convert

      - name: Publish to GHCR
        run: |
          mkdir to_publish
          for file in to_convert/*; do
              echo "Processing $file"
              rockcraft.skopeo --insecure-policy copy "docker-archive:${file}" "oci-archive:${file%.*}.rock"
          done
          mv to_convert/charmed-flink*.rock to_publish/
          cp rockcraft.yaml to_publish/
          release-rock --directory=to_publish/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
