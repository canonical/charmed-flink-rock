---
name: charmed-flink
base: ubuntu@22.04
version: '2.2.0'
summary: Charmed Flink ROCK OCI
description: |
  This is an OCI image that bundles Apache Flink together with other tools
  of its ecosystem in order to be used in Charmed Operators, providing
  automated operations management from day 0 to day 2 on the Apache Flink
  stream processing framework, on top of a K8s cluster. It is an open source,
  end-to-end, production ready data platform on top of cloud native
  technologies.
license: Apache-2.0

platforms:
  amd64:
  arm64:

services:
  flink:
    override: replace
    command: /opt/flink/bin/jobmanager.sh start-foreground
    startup: enabled
    user: flink
    group: flink
    environment:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk
      FLINK_HOME: /opt/flink

parts:
  flink:
    plugin: nil
    stage-packages:
      - openjdk-17-jre-headless
      - libpsl5
      - curl
    build-environment:
      - JAVA_HOME: /usr/lib/jvm/java-17-openjdk-${CRAFT_ARCH_BUILD_FOR}
      - FLINK_VERSION: "2.2.0"
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/lib/jvm/
      # Create an arch-independent symlink so JAVA_HOME works on both amd64 and arm64
      ln -sf /usr/lib/jvm/java-17-openjdk-${CRAFT_ARCH_BUILD_FOR} \
        $CRAFT_PART_INSTALL/usr/lib/jvm/java-17-openjdk
      ln -s /usr/lib/jvm/java-17-openjdk-${CRAFT_ARCH_BUILD_FOR}/bin/java \
        $CRAFT_PART_INSTALL/usr/bin/java
      ln -s /usr/lib/jvm/java-17-openjdk-${CRAFT_ARCH_BUILD_FOR}/bin/keytool \
        $CRAFT_PART_INSTALL/usr/bin/keytool

      curl -fsSL \
        "https://archive.apache.org/dist/flink/flink-${FLINK_VERSION}/flink-${FLINK_VERSION}-bin.tgz" \
        -o /tmp/flink.tgz
      tar -xzf /tmp/flink.tgz -C /tmp/

      mkdir -p $CRAFT_PART_INSTALL/var/lib/pebble/default/
      mkdir -p $CRAFT_PART_INSTALL/var/lib/flink/
      mkdir -p $CRAFT_PART_INSTALL/var/log/flink/
      mkdir -p $CRAFT_PART_INSTALL/opt/flink/
      mkdir -p $CRAFT_PART_INSTALL/etc/flink/

      cp -r /tmp/flink-${FLINK_VERSION}/bin $CRAFT_PART_INSTALL/opt/flink/
      cp -r /tmp/flink-${FLINK_VERSION}/lib $CRAFT_PART_INSTALL/opt/flink/
      cp -r /tmp/flink-${FLINK_VERSION}/opt $CRAFT_PART_INSTALL/opt/flink/
      cp -r /tmp/flink-${FLINK_VERSION}/plugins $CRAFT_PART_INSTALL/opt/flink/
      cp -r /tmp/flink-${FLINK_VERSION}/conf $CRAFT_PART_INSTALL/etc/flink/

      ln -s /etc/flink $CRAFT_PART_INSTALL/opt/flink/conf

  non-root-user:
    plugin: nil
    after: [flink]
    overlay-script: |
      groupadd -R $CRAFT_OVERLAY -g 1000 flink
      useradd -R $CRAFT_OVERLAY -M -r -g flink -u 1000 flink
    override-prime: |
      craftctl default
      install -d -o 1000 -g 1000 -m 770 \
        opt/flink \
        var/lib/flink \
        var/log/flink \
        etc/flink
